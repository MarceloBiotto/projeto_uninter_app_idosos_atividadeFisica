<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Treino Finalizado</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Treino Finalizado</h1>

        <h2 id="saudacao"></h2>

        <p>
            Parabéns por concluir seu treino!
        </p>

        <h2>Como você se sentiu?</h2>

        <select id="desconforto">

            <option value="">
                Selecione uma opção
            </option>

            <option value="Não senti desconforto">
                Não senti desconforto
            </option>

            <option value="Cansaço leve">
                Cansaço leve
            </option>

            <option value="Dor muscular">
                Dor muscular
            </option>

            <option value="Tontura">
                Tontura
            </option>

            <option value="Outro">
                Outro
            </option>

        </select>

        <textarea id="observacao" placeholder="Caso queira, descreva como se sentiu durante o treino.">
        </textarea>

        <button onclick="enviarWhatsApp()">

            Enviar pelo WhatsApp

        </button>

        <button onclick="finalizar()">

            Finalizar

        </button>

    </div>

    <script src="encerrar.js"></script>

</body>

</html>
