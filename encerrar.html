<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Treino Finalizado</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Treino Finalizado</h1>

        <p>

            Parabéns por concluir seu treino!

        </p>

        <h2>Como você se sentiu?</h2>

        <select id="desconforto">

            <option value="">Selecione</option>

            <option>Não senti desconforto</option>

            <option>Cansaço leve</option>

            <option>Dor muscular</option>

            <option>Tontura</option>

            <option>Outro</option>

        </select>

        <textarea id="observacao" placeholder="Caso queira, descreva como se sentiu.">
</textarea>

        <button onclick="finalizar()">

            Finalizar

        </button>

    </div>

    <script src="encerrar.js"></script>

</body>

</html>
